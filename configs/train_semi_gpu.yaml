# BugSight QA - YOLOv8 training on the semi-synthetic dataset, CUDA GPU
#
# GPU version of configs/train_semi.yaml (same data and augmentation
# reasoning): yolov8s, more epochs, bigger batch, mixed precision. A free
# Colab / Kaggle T4 runs it in roughly 20-30 minutes; see
# notebooks/train_colab.ipynb. Colab gives 2 CPU cores, hence workers: 2.

model:
  weights: yolov8s.pt
  task: detect

data:
  yaml: data/processed_semi/data.yaml

train:
  epochs: 100
  imgsz: 640
  batch: 32
  patience: 25
  optimizer: AdamW
  lr0: 0.002
  lrf: 0.02
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  warmup_momentum: 0.8
  box: 7.5
  cls: 0.7
  dfl: 1.5

augment:
  hsv_h: 0.0
  hsv_s: 0.3
  hsv_v: 0.3
  degrees: 0.0
  translate: 0.1
  scale: 0.3
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0

extra:
  cos_lr: true
  close_mosaic: 15
  flipud: 0.0
  erasing: 0.0
  amp: true
  cache: ram
  plots: true

output:
  project: runs
  name: bugsight_yolov8s_semi
  exist_ok: false

device: "0"
workers: 2
seed: 42
